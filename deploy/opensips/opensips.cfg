log_level = 3
stderror_enabled = no
syslog_enabled = yes
syslog_facility = LOG_LOCAL0

udp_workers = 2
socket = udp:100.111.230.4:5060

mpath = "/usr/lib/x86_64-linux-gnu/opensips/modules"

loadmodule "proto_udp.so"
loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "db_sqlite.so"
loadmodule "usrloc.so"
loadmodule "mid_registrar.so"
loadmodule "event_routing.so"
loadmodule "rest_client.so"

modparam("tm", "fr_timeout", 5)
modparam("tm", "fr_inv_timeout", 90)

modparam("rr", "append_fromtag", 0)
modparam("rr", "enable_double_rr", 1)

modparam("usrloc", "working_mode_preset", "single-instance-sql-write-through")
modparam("usrloc", "db_url", "sqlite:///var/lib/opensips/tsumuji-phone.sqlite")
modparam("usrloc", "contact_refresh_timer", true)

modparam("mid_registrar", "mode", 0)
modparam("mid_registrar", "max_expires", 2592000)
modparam("mid_registrar", "pn_enable", true)
modparam("mid_registrar", "pn_providers", "fcm")
modparam("mid_registrar", "pn_ct_match_params", "pn-provider, pn-prid, pn-param")
modparam("mid_registrar", "pn_skip_pn_interval", 0)
modparam("mid_registrar", "pn_trigger_interval", 86400)
modparam("mid_registrar", "pn_refresh_timeout", 15)

modparam("rest_client", "connection_timeout", 2)
modparam("rest_client", "curl_timeout", 4)

route {
    if (!mf_process_maxfwd_header(10)) {
        send_reply(483, "Too Many Hops");
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
        }
        exit;
    }

    if (has_totag()) {
        if (loose_route()) {
            route(RELAY);
        } else if (is_method("ACK") && t_check_trans()) {
            t_relay();
        } else {
            send_reply(404, "Not Found");
        }
        exit;
    }

    if (is_method("REGISTER")) {
        mid_registrar_save("location");
        switch ($retcode) {
        case 1:
            $du = "sip:100.111.230.4:5061;transport=udp";
            route(RELAY);
            break;
        case 2:
            break;
        default:
            send_reply(500, "Registration Proxy Error");
        }
        exit;
    }

    if ($si == "100.111.230.4" && $sp == 5061) {
        if (is_method("OPTIONS")) {
            send_reply(200, "OK");
            exit;
        }
        if (!is_method("INVITE|MESSAGE")) {
            send_reply(405, "Method Not Allowed");
            exit;
        }

        record_route();
        $var(lookup_result) = mid_registrar_lookup("location");
        switch ($var(lookup_result)) {
        case 1:
            route(RELAY);
            break;
        case 2:
            # The INVITE remains suspended. A matching REGISTER creates its branch.
            break;
        case -1:
        case -2:
            send_reply(404, "Not Found");
            break;
        default:
            send_reply(500, "Location Lookup Error");
        }
        exit;
    }

    if (!is_method("INVITE|ACK|BYE|UPDATE|INFO|PRACK|OPTIONS")) {
        send_reply(405, "Method Not Allowed");
        exit;
    }

    record_route();
    $du = "sip:100.111.230.4:5061;transport=udp";
    route(RELAY);
}

route [RELAY] {
    if (!t_relay()) {
        send_reply(500, "Relay Error");
    }
    exit;
}

event_route [E_UL_CONTACT_REFRESH] {
    $var(provider) = $(param(uri){param.value,pn-provider});
    $var(device_id) = $(param(uri){param.value,pn-prid});
    $var(application) = $(param(uri){param.value,pn-param});

    if ($var(provider) != "fcm" ||
        $var(application) != "app.tsumujiphone.local" ||
        $var(device_id) !~ "^[A-Za-z0-9_-]{22}$") {
        xlog("L_WARN", "rejected invalid push contact coordinates\n");
        exit;
    }

    $var(payload) = "{\"deviceId\":\"" + $var(device_id) + "\"}";
    $var(rest_result) = rest_post(
        "http://127.0.0.1:8788/internal/v1/wake",
        $var(payload),
        "application/json",
        $var(response_body),
        $var(response_type),
        $var(response_code)
    );
    if ($var(rest_result) < 0 || $var(response_code) != 200) {
        xlog("L_ERR", "push gateway request failed\n");
    }
}
