[package]
name = "hikari-phone"
version.workspace = true
description = "RT-500KI Hikari Denwa client"
authors = ["Hikari Phone contributors"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hikari_phone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
native-pjsip = ["telephony-pjsip/native-pjsip"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
keyring = { version = "3", features = ["sync-secret-service"] }
telephony-core = { path = "../crates/telephony-core" }
telephony-pjsip = { path = "../crates/telephony-pjsip" }

[lints]
workspace = true
