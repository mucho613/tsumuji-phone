[package]
name = "tsumuji-phone"
version.workspace = true
description = "Asterisk SIP client for Tsumuji Phone"
authors = ["Tsumuji Phone contributors"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tsumuji_phone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
native-pjsip = ["telephony-pjsip/native-pjsip"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
telephony-core = { path = "../crates/telephony-core" }
telephony-pjsip = { path = "../crates/telephony-pjsip" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
telephony-pjsip = { path = "../crates/telephony-pjsip", features = ["native-pjsip"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
if-addrs = "0.14"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
pedantic = "warn"
