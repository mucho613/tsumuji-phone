[workspace]
resolver = "2"
members = [
    "crates/tsumuji-phone-cli",
    "crates/telephony-core",
    "crates/telephony-pjsip",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
